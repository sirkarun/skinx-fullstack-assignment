services:
  postgres:
    image: postgres:16-alpine
    container_name: skinx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: skinx
      POSTGRES_PASSWORD: skinx_password
      POSTGRES_DB: skinx
    ports:
      - "5432:5432"
    volumes:
      - skinx_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skinx -d skinx"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: skinx-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://skinx:skinx_password@postgres:5432/skinx?schema=public
      JWT_SECRET: change-me-in-production-this-is-only-for-local-docker
      JWT_EXPIRES_IN: 1d
      CORS_ORIGIN: http://localhost:3000
      SEED_DEFAULT_USER_EMAIL: admin@skinx.local
      SEED_DEFAULT_USER_PASSWORD: Password123!
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* is baked at build time; this must be a URL the BROWSER can reach
        NEXT_PUBLIC_API_BASE_URL: http://localhost:4000/api
    container_name: skinx-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  skinx_pgdata:
